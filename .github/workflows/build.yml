name: Build APK & Draft Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Prepare APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/Vtool_Global-v1.0.0.apk
        ls -la dist/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vtool_Global-v1.0.0-build${{ github.run_number }}
        path: dist/*.apk

    - name: Create or update DRAFT release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Vtool_Global v1.0.0 (Draft — Build #${{ github.run_number }})
        body: |
          ## Vtool_Global v1.0.0

          **Build:** #${{ github.run_number }}
          **Commit:** `${{ github.sha }}`

          ---

          ### ⚠️ مسودة
          عدّل هذا الوصف بالتغييرات النهائية، ثم اضغط **Publish release**.

          ---

          ### الميزات
          - اللغة الافتراضية: English
          - لغات مضافة: العربية، اليابانية، الصينية
          - منتقي اللغة داخل التطبيق
          - الإصدار: 1.0.0
        draft: true
        prerelease: false
        files: dist/*.apk
        overwrite_files: true
